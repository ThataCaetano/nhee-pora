<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1C26">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Consulta de palavras Tupi-Guarani">
<title>Nhe’ẽ porã</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9DAC5;--card:#F6ECDC;--ink:#1A1C26;--mute:#6B5645;--line:#CDB89B;--acc:#C8401F;--leaf:#8C5330;--chip:#DCC6A8;--jen:#1A1C26;--areia:#F0E4D2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151C;--card:#1E202B;--ink:#F0E4D2;--mute:#B09A85;--line:#2E303D;--acc:#E4673F;--leaf:#C58F62;--chip:#2A2C39;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14151C;--card:#1E202B;--ink:#F0E4D2;--mute:#B09A85;--line:#2E303D;--acc:#E4673F;--leaf:#C58F62;--chip:#2A2C39;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "Instrument Sans",system-ui,sans-serif}
.app{max-width:480px;margin:0 auto;padding:20px 16px 96px}
button{font:inherit;color:inherit;cursor:pointer}
h1{font:400 25px/1.15 Bungee,"Rubik Mono One",Impact,sans-serif;margin:0}
.sub{color:var(--mute);margin:4px 0 16px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mode{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.mode[aria-pressed="true"]{background:var(--leaf);color:var(--bg);border-color:var(--leaf)}
input[type=search]{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input[type=search]:focus,textarea:focus{outline:none;border-color:var(--leaf)}
button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:7px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dia{display:block;width:100%;text-align:left;border:0;background:var(--jen);color:var(--areia);border-radius:14px;padding:18px;margin:4px 0 14px}
.dia small{opacity:.85}.dia .w{display:block;font:400 26px/1.15 Bungee,Impact,sans-serif;margin:8px 0 4px;color:var(--areia)}
.row{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 2px}
.row .w{font:400 15px/1.3 Bungee,Impact,sans-serif;min-width:36%}
.row .t{color:var(--mute);flex:1;font-size:15px}
.ok{color:var(--leaf);font-style:normal}
.cnt,.empty{color:var(--mute);font-size:14px}
.back{border:0;background:none;color:var(--mute);padding:4px 0;margin-bottom:10px;font-size:15px}
.big{font:400 34px/1.15 Bungee,Impact,sans-serif;margin:6px 0 10px;padding-left:14px;border-left:6px solid var(--acc);overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{background:var(--chip);border-radius:8px;padding:3px 10px;font-size:13px}
.mean{list-style:none;padding:0;margin:14px 0}
.mean li{font:400 22px/1.3 Newsreader,Georgia,serif;padding:6px 0;border-bottom:1px solid var(--line)}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.note b{display:block;font-size:13px;color:var(--mute);font-weight:500;margin-bottom:2px}
.badge{display:inline-block;border-radius:8px;padding:6px 12px;font-size:14px;background:var(--chip);color:var(--mute);margin:6px 0}
.badge.v{background:var(--leaf);color:var(--bg)}.badge.r{background:var(--acc);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
textarea{width:100%;box-sizing:border-box;min-height:80px;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:8px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:14px 0;font-size:15px;color:var(--mute)}
.tabs button[aria-current="true"]{color:var(--acc);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;display:none}
.faixa{display:block;height:26px;margin:12px 0;border-radius:3px;background:var(--areia) url("faixa.png") repeat-x left center;background-size:auto 100%}
.faixa.l{height:20px}
.dia .faixa{margin:0 0 10px}
.h2{font:600 16px/1.3 "Instrument Sans",sans-serif;margin:22px 0 6px}
.pes{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.papel{display:inline-block;background:var(--jen);color:var(--areia);border-radius:999px;padding:4px 12px;font-size:13px}
.logo{display:block;width:100%;aspect-ratio:900/304;margin:0 0 14px;background:center/contain no-repeat}
.logo-c{background-image:url(logo_claro.png)}.logo-e{display:none;background-image:url(logo_escuro.png)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-c{display:none}:root:not([data-theme="light"]) .logo-e{display:block}}
:root[data-theme="dark"] .logo-c{display:none}:root[data-theme="dark"] .logo-e{display:block}

form{display:grid;gap:12px;margin:12px 0}
label{font-size:14px;color:var(--mute);display:grid;gap:4px}
input[type=email],input[type=password],input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input[type=email]:focus,input[type=password]:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--leaf)}
input.code{letter-spacing:.35em;text-align:center;font-size:24px}
.chk{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.chk input{margin-top:3px;width:18px;height:18px;flex:none}
.err,.okmsg{background:var(--card);border:2px solid var(--acc);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.okmsg{border-color:var(--leaf)}
.lnk{border:0;background:none;color:var(--leaf);text-decoration:underline;padding:8px 0;font-size:15px}
.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qr{display:block;width:210px;height:210px;margin:10px auto;background:#fff;padding:8px;border-radius:12px}
.sec{word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--card);border:1px solid var(--line);padding:8px 10px;border-radius:8px;margin-bottom:6px}
.passos{padding-left:20px;margin:8px 0}.passos li{margin:4px 0}
select{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.adm{align-items:flex-start;flex-wrap:wrap}.adm .quem{flex:1 1 200px;overflow-wrap:anywhere}.adm .ctl{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{padding:14px 0}
a.btn{color:inherit;text-decoration:none;display:inline-block}
.sobre p{margin:0 0 14px;line-height:1.6}
.dedica{font:600 17px/1.4 "Instrument Sans",sans-serif;border-left:6px solid var(--acc);padding:6px 0 6px 14px;margin-top:22px!important}
.homenagem{display:block;width:100%;height:auto;border-radius:14px;margin:4px 0 8px;border:1px solid var(--line)}
.btn.danger{background:transparent;border-color:var(--acc);color:var(--acc)}
.note.perigo{border:2px solid var(--acc)}
.adminbox{border-style:dashed}
.adminbox .acts{margin:6px 0 0}
form label textarea{margin:0}
form select{width:100%;box-sizing:border-box;font-size:17px;padding:12px 14px}
</style></head>
<body><div class="app"><main id="m"></main></div>
<nav class="tabs" id="nav"></nav>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// A configuração fica no arquivo config.js (assim, atualizar o site não apaga as suas chaves).
const CONFIG = window.NHEE_CONFIG || {};
const LINGUAS = {tpw:"Tupi antigo", gn:"Guarani (paraguaio)", gun:"Guarani mbyá", kgk:"Guarani kaiowá", yrl:"Nheengatu"};
const PAPEL = {estudante:"Estudante", mestre:"Mestre", admin:"Administrador"};
const PAPEL_DESC = {
  estudante: "Consulta as palavras e guarda favoritos.",
  mestre: "Consulta as palavras e, em breve, avalia e grava pronúncias.",
  admin: "Gerencia os acessos e as palavras: adiciona, edita, exclui e marca como avaliada pelo mestre."
};
const $ = id => document.getElementById(id);
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’'`´ʼ‘]/g,"").replace(/\s+/g," ").trim();
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let sb=null, ses=null, perfil=null, D=[], cats=[], tab="b", q="", cat="", sel=null, fav=new Set();
let view="load", modo="login", msg="", msgTipo="err", emailEnv="", enr=null, chFactor=null, rec=false;
let offline=false, admList=null, busy=false, again=false, gt=null;
let form=null, confDel=false;   // form: {id} ao adicionar/editar | confDel: pedindo confirmação para excluir

// ---------- palavras ----------
function prep(j){
  const obs=j.observacao||"", c=/Categoria: ([^.,|]*)/.exec(obs), n=/A conferir \(nota do curso\) - ([\s\S]*)$/.exec(obs);
  const e={raw:j,id:j.id,lg:j.lingua||"tpw",ap:j.avaliado_por||"",ae:j.avaliado_em||"",p:j.palavra,v:j.variantes||[],pt:j.portugues||[],c:j.classe||"",cat:c?c[1].trim():"Outros",
    nota:n?n[1].trim():"",l:LINGUAS[j.lingua]||j.lingua||"",s:j.status||"pendente",au:(j.audios||[]).map(a=>a.arquivo)};
  e.n=norm(e.p); e.vn=e.v.map(norm); e.tn=e.pt.map(norm); return e;
}
const byWord=(a,b)=>a.n.localeCompare(b.n);
function score(e,s){
  if(e.n===s||e.vn.includes(s))return 100;
  if(e.tn.includes(s))return 95;
  if(e.n.startsWith(s))return 80;
  if(e.vn.some(x=>x.startsWith(s)))return 70;
  if(e.tn.some(x=>x.split(" ").some(w=>w.startsWith(s))))return 60;
  if(s.length<3)return 0;
  const all=[e.n,...e.vn,...e.tn].join(" | ");
  return s.split(" ").every(t=>all.includes(t))?30:0;
}
function aplicarRows(rows){
  D=rows.map(r=>prep(Object.assign({},r.dados,{id:r.id}))).filter(e=>e.s!=="rejeitado");
  cats=[...new Set(D.map(e=>e.cat))].sort();
}
async function carregarPalavras(){
  let rows=[],from=0;
  for(;;){
    const r=await sb.from("palavras").select("id,dados").order("id").range(from,from+999);
    if(r.error)throw r.error;
    rows=rows.concat(r.data);
    if(r.data.length<1000)break;
    from+=1000;
  }
  aplicarRows(rows);
  try{localStorage.setItem("nhee-cache",JSON.stringify({uid:ses.user.id,perfil:perfil,rows:rows}))}catch(e){}
}
function abrirOffline(aal){
  try{
    const c=JSON.parse(localStorage.getItem("nhee-cache")||"null");
    if(c&&ses&&c.uid===ses.user.id&&aal&&aal.currentLevel==="aal2"){
      perfil=c.perfil; aplicarRows(c.rows); offline=true; carregarFav(); view="app"; render(); return true;
    }
  }catch(e){}
  return false;
}
const favKey=()=>"nhee-fav-"+(ses&&ses.user?ses.user.id:"");
function carregarFav(){fav=new Set();try{fav=new Set(JSON.parse(localStorage.getItem(favKey())||"[]"))}catch(e){}}
function salvarFav(){try{localStorage.setItem(favKey(),JSON.stringify([...fav]))}catch(e){}}

// ---------- mensagens ----------
function traduz(e){
  const m=((e&&e.message)||"").toLowerCase(), c=((e&&e.code)||"").toLowerCase();
  if(m.includes("invalid login")||c==="invalid_credentials")return "E-mail ou senha incorretos.";
  if(m.includes("not confirmed")||c==="email_not_confirmed")return "Confirme o seu e-mail pelo link que enviamos e depois entre.";
  if(c.includes("rate_limit")||m.includes("rate limit")||(e&&e.status===429))return "Muitas tentativas. Espere alguns minutos e tente de novo.";
  if(c.includes("mfa")||m.includes("totp")||m.includes("invalid code")||m.includes("verification"))return "Código incorreto ou vencido. Use o código atual do aplicativo.";
  if(c==="weak_password"||m.includes("password"))return "Senha fraca. Use pelo menos 10 caracteres, com letras e números.";
  if(c==="same_password")return "A nova senha precisa ser diferente da atual.";
  return "Não foi possível concluir. Verifique a conexão e tente de novo.";
}
const msgHtml=()=>msg?`<div class="${msgTipo}" role="alert">${esc(msg)}</div>`:"";
function setMsg(t,tipo){msg=t;msgTipo=tipo||"err";const e=$("msg");if(e)e.innerHTML=msgHtml()}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",3200)}

// ---------- telas de entrada ----------
const vLoad=()=>`<p class="empty">Carregando…</p>`;
const vConfig=()=>`<h1>Falta configurar</h1><span class="faixa l"></span><p>Abra o arquivo <b>config.js</b> e preencha <b>supabaseUrl</b> e <b>supabaseKey</b> (veja o guia).</p>`;
const vErro=()=>`<div id="msg">${msgHtml()}</div><div class="acts"><button class="btn pri" data-a="recheck">Tentar de novo</button></div>`;
function vAuth(){
  if(modo==="enviado")return `<h1>Quase lá</h1><span class="faixa l"></span>
    <p>Enviamos um link de confirmação para <b>${esc(emailEnv)}</b>, se esse e-mail ainda não tiver cadastro.</p>
    <p>Abra o e-mail, clique no link e depois volte aqui para entrar. Olhe também a caixa de spam.</p>
    <button class="btn pri" data-modo="login">Ir para o login</button>`;
  if(modo==="enviadoSenha")return `<h1>Confira o e-mail</h1><span class="faixa l"></span>
    <p>Se <b>${esc(emailEnv)}</b> tiver cadastro, enviamos um link para criar uma nova senha. Você vai precisar do código do aplicativo autenticador para concluir.</p>
    <button class="btn pri" data-modo="login">Voltar ao login</button>`;
  if(modo==="cadastro")return `<h1>Criar conta</h1><span class="faixa l"></span>
    <form id="f-cad" autocomplete="on">
      <label>Nome<input name="nome" type="text" autocomplete="name" required maxlength="120"></label>
      <label>E-mail<input name="email" type="email" autocomplete="email" required></label>
      <label>Senha (mínimo 10 caracteres)<input name="senha" type="password" autocomplete="new-password" minlength="10" required></label>
      <label>Repita a senha<input name="senha2" type="password" autocomplete="new-password" minlength="10" required></label>
      <label class="chk"><input name="termos" type="checkbox" required><span>Declaro que esta conta é de <b>uso pessoal e intransferível</b>. Não vou compartilhar minha senha nem o acesso ao aplicativo autenticador, e vou usar o conteúdo com respeito aos povos e às comunidades.</span></label>
      <div id="msg">${msgHtml()}</div>
      <button class="btn pri" type="submit">Criar conta</button>
    </form>
    <p class="sub">Depois de confirmar o e-mail, você vai ativar a verificação em dois fatores. O acesso só é liberado depois que o administrador aprovar o seu cadastro.</p>
    <button class="lnk" data-modo="login">Já tenho conta</button>`;
  if(modo==="esqueci")return `<h1>Recuperar senha</h1><span class="faixa l"></span>
    <form id="f-esq">
      <label>E-mail da conta<input name="email" type="email" autocomplete="email" required></label>
      <div id="msg">${msgHtml()}</div>
      <button class="btn pri" type="submit">Enviar link</button>
    </form>
    <button class="lnk" data-modo="login">Voltar ao login</button>`;
  return `<h1>Entrar</h1><span class="faixa l"></span>
    <form id="f-login">
      <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
      <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
      <div id="msg">${msgHtml()}</div>
      <button class="btn pri" type="submit">Entrar</button>
    </form>
    <div class="links"><button class="lnk" data-modo="cadastro">Criar conta</button><button class="lnk" data-modo="esqueci">Esqueci a senha</button></div>`;
}
function vEnroll(){
  if(!enr)return `<h1>Segurança da conta</h1><span class="faixa l"></span><div id="msg">${msgHtml()}</div><p class="empty">Preparando…</p>`;
  return `<h1>Ative o 2º fator</h1><span class="faixa l"></span>
    <p>Para proteger a sua conta, o acesso exige um código de 6 números a cada entrada.</p>
    <ol class="passos">
      <li>Instale um aplicativo autenticador (Google Authenticator, Microsoft Authenticator, Authy ou 1Password).</li>
      <li>Leia o QR code abaixo com o aplicativo.</li>
      <li>Digite aqui o código de 6 números que o aplicativo mostrar.</li>
    </ol>
    <img class="qr" alt="QR code para o aplicativo autenticador" src="${esc(enr.qr)}">
    <p class="sub">Sem câmera? Digite esta chave no aplicativo:</p>
    <div class="sec">${esc(enr.secret)}</div>
    <form id="f-cod">
      <label>Código de 6 números<input class="code" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
      <div id="msg">${msgHtml()}</div>
      <button class="btn pri" type="submit">Confirmar e entrar</button>
    </form>
    <button class="lnk" data-a="sair">Sair</button>`;
}
const vChallenge=()=>`<h1>Código de segurança</h1><span class="faixa l"></span>
  <p>Digite o código de 6 números do seu aplicativo autenticador.</p>
  <form id="f-cod">
    <label>Código de 6 números<input class="code" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
    <div id="msg">${msgHtml()}</div>
    <button class="btn pri" type="submit">Entrar</button>
  </form>
  <button class="lnk" data-a="sair">Sair</button>`;
const vNova=()=>`<h1>Nova senha</h1><span class="faixa l"></span>
  <form id="f-nova">
    <label>Nova senha (mínimo 10 caracteres)<input name="senha" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>Repita a nova senha<input name="senha2" type="password" autocomplete="new-password" minlength="10" required></label>
    <div id="msg">${msgHtml()}</div>
    <button class="btn pri" type="submit">Salvar nova senha</button>
  </form>`;
const vPend=()=>`<h1>Aguardando aprovação</h1><span class="faixa l"></span>
  <p>Olá, <b>${esc(perfil&&perfil.nome||"")}</b>. O seu cadastro foi recebido e a verificação em dois fatores está ativa.</p>
  <p>O acesso às palavras será liberado quando o administrador aprovar a sua conta. Volte mais tarde e toque em verificar.</p>
  <div class="acts"><button class="btn pri" data-a="recheck">Verificar de novo</button><button class="btn" data-a="sair">Sair</button></div>`;

// ---------- app (depois do login) ----------
const row=e=>`<button class="row" data-id="${e.id}"><span class="w">${esc(e.p)}</span><span class="t">${esc(e.pt.join(", "))}</span>${e.s==="validado"?'<i class="ok" title="Validado">✔</i>':""}</button>`;
function dia(){
  if(!D.length)return "";
  const d=Math.floor(Date.now()/864e5),e=D[d%D.length];
  return `<button class="dia" data-id="${e.id}"><span class="faixa"></span><small>Palavra do dia</small><span class="w">${esc(e.p)}</span>${esc(e.pt.join(", "))}</button>`;
}
function results(){
  const r=$("res"); if(!r)return;
  const s=norm(q); let list;
  if(s){
    list=D.map(e=>[score(e,s),e]).filter(x=>x[0]>0&&(!cat||x[1].cat===cat)).sort((a,b)=>b[0]-a[0]||byWord(a[1],b[1])).map(x=>x[1]);
    r.innerHTML=list.length?`<p class="cnt">${list.length} resultado${list.length>1?"s":""}</p>`+list.map(row).join(""):`<p class="empty">Nada encontrado para “${esc(q)}”. Tente outra grafia ou o significado em português.</p>`;
  }else{
    list=D.filter(e=>!cat||e.cat===cat).sort(byWord);
    r.innerHTML=(cat?"":dia())+list.map(row).join("");
  }
}

    <button class="btn" data-a="editar">Editar</button>
    <button class="btn danger" data-a="excluir">Excluir</button></div></div>`;

function vForm(){
  const e=form.id!=null?D.find(x=>x.id===form.id):null;
  const novoRegistro=!e, v=e||{p:"",v:[],pt:[],c:"",cat:"",nota:"",lg:"tpw"};
  const catAtual=v.cat&&v.cat!=="Outros"?v.cat:(e?"Outros":"");
  return `<button class="back" data-a="cancelar-form">‹ Cancelar</button>
  <h1>${novoRegistro?"Nova palavra":"Editar palavra"}</h1><span class="faixa l"></span>

    <label>Significados em português (um por linha)<textarea name="portugues" required rows="3" maxlength="600">${esc(v.pt.join("\n"))}</textarea></label>
    <label>Também escrito (variantes, separadas por vírgula)<input name="variantes" type="text" maxlength="200" value="${esc(v.v.join(", "))}"></label>
    <label>Língua<select name="lingua">${Object.keys(LINGUAS).map(k=>`<option value="${k}" ${v.lg===k?"selected":""}>${esc(LINGUAS[k])}</option>`).join("")}</select></label>
    <label>Categoria<input name="categoria" type="text" list="lista-cats" maxlength="40" value="${esc(catAtual)}" placeholder="Ex.: Animais"></label>
    <datalist id="lista-cats">${cats.map(c=>`<option value="${esc(c)}"></option>`).join("")}</datalist>
    <label>Classe (opcional)<input name="classe" type="text" maxlength="40" value="${esc(v.c)}" placeholder="Ex.: substantivo, verbo"></label>
    <label>Nota do curso (opcional)<textarea name="nota" rows="2" maxlength="500">${esc(v.nota)}</textarea></label>
    ${e&&e.s==="validado"?`<p class="sub">Atenção: ao salvar uma edição, a palavra volta para “aguardando avaliação do mestre”.</p>`:""}
    <div id="msg">${msgHtml()}</div>
    <button class="btn pri" type="submit">Salvar palavra</button>
  </form>`;
}
function dadosDoForm(f){
  const g=n=>(f.elements[n].value||"").trim(), lista=(t,sep)=>t.split(sep).map(x=>x.trim()).filter(Boolean);
  const e=form.id!=null?D.find(x=>x.id===form.id):null;
  const base=Object.assign({},e?e.raw:{});
  delete base.id; delete base.avaliado_por; delete base.avaliado_em;
  const cat=g("categoria").replace(/[.,|]/g," ").replace(/\s+/g," ").trim()||"Outros";
  const nota=g("nota");
  return Object.assign(base,{
    palavra:g("palavra"), lingua:g("lingua"), classe:g("classe"),
    variantes:lista(g("variantes"),","), portugues:lista(f.elements.portugues.value,"\n"),
    observacao:"Categoria: "+cat+(nota?". A conferir (nota do curso) - "+nota:""),
    status:"pendente", audios:base.audios||[]
  });
}
function logo(){return '<div class="logo logo-c" role="img" aria-label="Nhe’ẽ porã"></div><div class="logo logo-e" role="img" aria-label="Nhe’ẽ porã"></div>'}

function render(){
  const m=$("m"), nav=$("nav");
  nav.innerHTML="";
  if(view==="app"){
    const ts=[["b","Buscar"],["f","Favoritos"],["c","Conta"]];
    if(perfil.papel==="admin"&&!offline)ts.push(["a","Admin"]);
    nav.innerHTML=ts.map(t=>`<button data-t="${t[0]}" aria-current="${t[0]===tab&&sel===null}">${t[1]}</button>`).join("");
    if(form!==null){m.innerHTML=vForm();return}
    if(sel!==null){const e=D.find(x=>x.id===sel);if(e){m.innerHTML=detail(e);return}sel=null}
    if(tab==="a"&&admList===null)carregarAdm().then(render);
    m.innerHTML=(offline?'<div class="note">Sem internet: usando a cópia salva neste aparelho.</div>':"")+({b:viewBuscar,f:viewFav,c:viewConta,a:viewAdmin}[tab]||viewBuscar)();
    if(tab==="b")results();
    return;
  }
  const f={load:vLoad,config:vConfig,auth:vAuth,enroll:vEnroll,challenge:vChallenge,novasenha:vNova,pendente:vPend,erro:vErro}[view]||vLoad;
  m.innerHTML=(view==="pendente"?"":logo())+f();
}

// ---------- fluxo de acesso ----------
function agenda(){clearTimeout(gt);gt=setTimeout(gate,50)}
async function gate(){
  if(busy){again=true;return}
  busy=true;
  try{await gate2()}catch(e){msg="Não foi possível conectar. Verifique a internet e tente de novo.";msgTipo="err";view="erro";render()}
  busy=false;
  if(again){again=false;agenda()}
}
async function gate2(){
  offline=false;
  const s=await sb.auth.getSession(); ses=s.data&&s.data.session;
  if(!ses){D=[];perfil=null;sel=null;form=null;confDel=false;tab="b";q="";cat="";admList=null;enr=null;view="auth";return render()}
  let aal=null,fac=null;
  try{aal=(await sb.auth.mfa.getAuthenticatorAssuranceLevel()).data}catch(e){}
  try{const f=await sb.auth.mfa.listFactors(); if(f.error)throw f.error; fac=f.data.totp||[]}catch(e){
    if(abrirOffline(aal))return;
    throw e;
  }
  if(!fac.length){
    view="enroll"; render();
    if(!enr)await iniciarEnroll();
    return;
  }
  enr=null;
  if(!aal||aal.currentLevel!=="aal2"){chFactor=fac[0].id;view="challenge";msg="";return render()}
  if(rec){view="novasenha";msg="";return render()}
  const p=await sb.from("perfis").select("*").eq("id",ses.user.id).single();
  if(p.error){if(abrirOffline(aal))return;throw p.error}
  perfil=p.data;
  if(!perfil.ativo){view="pendente";return render()}
  try{await carregarPalavras()}catch(e){if(abrirOffline(aal))return;throw e}
  carregarFav(); msg=""; view="app"; render();
}
async function iniciarEnroll(){
  try{
    const l=await sb.auth.mfa.listFactors();
    for(const f of ((l.data&&l.data.all)||[]))if(f.status!=="verified")await sb.auth.mfa.unenroll({factorId:f.id});
    const r=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"Nhe-e-pora "+Date.now()});
    if(r.error)throw r.error;
    enr={id:r.data.id,qr:r.data.totp.qr_code,secret:r.data.totp.secret};
    render();
  }catch(e){setMsg(traduz(e))}
}
async function sair(){
  try{localStorage.removeItem("nhee-cache")}catch(e){}
  rec=false;enr=null;
  await sb.auth.signOut();
  agenda();
}

// ---------- eventos ----------
document.addEventListener("submit",async ev=>{
  ev.preventDefault();
  const f=ev.target, b=f.querySelector("[type=submit]"), val=n=>f.elements[n]?f.elements[n].value:"";
  if(b)b.disabled=true;
  try{
    if(f.id==="f-login"){
      const r=await sb.auth.signInWithPassword({email:val("email").trim(),password:val("senha")});
      if(r.error)setMsg(traduz(r.error)); else agenda();
    }else if(f.id==="f-cad"){
      if(val("senha")!==val("senha2"))return setMsg("As senhas não são iguais.");
      if(val("senha").length<10)return setMsg("A senha precisa ter pelo menos 10 caracteres.");
      if(!f.elements.termos.checked)return setMsg("É preciso aceitar a declaração de uso pessoal.");
      const email=val("email").trim();
      const r=await sb.auth.signUp({email:email,password:val("senha"),options:{data:{nome:val("nome").trim(),termos:true},emailRedirectTo:location.origin+location.pathname}});
      if(r.error)return setMsg(traduz(r.error));
      if(r.data&&r.data.session)return agenda();
      emailEnv=email;modo="enviado";msg="";render();
    }else if(f.id==="f-esq"){
      const email=val("email").trim();
      const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(r.error&&((r.error.status===429)||/rate/i.test(r.error.message||"")))return setMsg(traduz(r.error));
      emailEnv=email;modo="enviadoSenha";msg="";render();
    }else if(f.id==="f-cod"){
      const fid=view==="enroll"&&enr?enr.id:chFactor;
      const r=await sb.auth.mfa.challengeAndVerify({factorId:fid,code:val("codigo").trim()});
      if(r.error)setMsg(traduz(r.error)); else {enr=null;msg="";agenda()}
    }else if(f.id==="f-palavra"){
      if(!souAdmin())return;
      const dados=dadosDoForm(f);
      if(!dados.palavra)return setMsg("A palavra não pode ficar vazia.");
      if(!dados.portugues.length)return setMsg("Informe pelo menos um significado.");
      const r=await sb.rpc("salvar_palavra",{p_id:form.id,p_dados:dados});
      if(r.error)return setMsg(r.error.message||traduz(r.error));
      const novoId=r.data; form=null; confDel=false; msg=""; sel=novoId;
      await recarregar(); toast("Palavra salva.");
    }else if(f.id==="f-nova"){
      if(val("senha")!==val("senha2"))return setMsg("As senhas não são iguais.");
      const r=await sb.auth.updateUser({password:val("senha")});
      if(r.error)return setMsg(traduz(r.error));
      rec=false;toast("Senha alterada.");agenda();
    }
  }finally{if(b)b.disabled=false}
});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){q=ev.target.value;results()}});
document.addEventListener("change",async ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.a==="papel"){
    const r=await sb.rpc("definir_papel",{alvo:t.dataset.u,novo:t.value});
    toast(r.error?r.error.message:"Perfil atualizado.");
    await carregarAdm();render();
  }
});
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-id],[data-c],[data-a],[data-t],[data-modo]"); if(!t)return;
  const d=t.dataset;
  if(d.modo){modo=d.modo;msg="";return render()}
  if(d.t){tab=d.t;sel=null;form=null;confDel=false;if(tab==="a")admList=null;render();return window.scrollTo(0,0)}
  if(d.id!==undefined){sel=+d.id;confDel=false;render();return window.scrollTo(0,0)}
  if(d.c!==undefined){cat=d.c;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.c===cat)));return results()}
  const e=sel!==null?D.find(x=>x.id===sel):null;
  if(d.a==="back"){sel=null;confDel=false;render()}
  else if(d.a==="nova"&&souAdmin()){form={id:null};msg="";render();window.scrollTo(0,0)}
  else if(d.a==="editar"&&e&&souAdmin()){form={id:e.id};msg="";render();window.scrollTo(0,0)}
  else if(d.a==="cancelar-form"){form=null;msg="";render()}
  else if(d.a==="excluir"&&e&&souAdmin()){confDel=true;render()}
  else if(d.a==="excluir-nao"){confDel=false;render()}
  else if(d.a==="excluir-sim"&&e&&souAdmin()){
    t.disabled=true;
    const r=await sb.rpc("excluir_palavra",{p_id:e.id});
    confDel=false;
    if(r.error){toast(r.error.message||traduz(r.error));return render()}
    sel=null; fav.delete(e.id); salvarFav();
    await recarregar(); toast("Palavra excluída.");
  }
  else if(d.a==="avaliar"&&e&&souAdmin()){
    t.disabled=true;
    const r=await sb.rpc("definir_avaliacao",{p_id:e.id,p_validado:d.v==="1"});
    if(r.error){toast(r.error.message||traduz(r.error));return render()}
    await recarregar(); toast(d.v==="1"?"Marcada como avaliada pelo mestre.":"Avaliação removida.");
  }
  else if(d.a==="fav"&&e){fav.has(e.id)?fav.delete(e.id):fav.add(e.id);salvarFav();render()}
  else if(d.a==="play"&&e){new Audio(e.au[0]).play().catch(()=>toast("Não foi possível tocar o áudio."))}
  else if(d.a==="sair")sair();
  else if(d.a==="recheck"){msg="";agenda()}
  else if(d.a==="ativo"){
    const r=await sb.rpc("definir_ativo",{alvo:d.u,novo:d.v==="1"});
    toast(r.error?r.error.message:(d.v==="1"?"Acesso aprovado.":"Acesso bloqueado."));
    await carregarAdm();render();
  }
});
async function recarregar(){
  try{await carregarPalavras()}catch(e){toast("Salvo, mas não foi possível atualizar a lista. Reabra o app.")}
  render();
}
async function carregarAdm(){
  const r=await sb.from("perfis").select("id,email,nome,papel,ativo,criado_em").order("criado_em",{ascending:false});
  admList=r.error?[]:r.data;
  if(r.error)toast("Não foi possível carregar a lista.");
}

// ---------- início ----------
function iniciar(){
  render();
  if(!CONFIG.supabaseUrl||!CONFIG.supabaseKey){view="config";return render()}
  if(!window.supabase){msg="Não foi possível carregar o app. Conecte-se à internet e tente de novo.";view="erro";return render()}
  sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev)=>{
    if(ev==="PASSWORD_RECOVERY")rec=true;
    if(ev==="SIGNED_OUT"){try{localStorage.removeItem("nhee-cache")}catch(e){}}
    if(ev==="INITIAL_SESSION"||ev==="TOKEN_REFRESHED")return;
    if(ev==="SIGNED_IN"&&view==="app")return;
    agenda();
  });
  agenda();
}
iniciar();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
